    <rect x="0" y="-2.5" width="6" height="5" rx="1" fill="#fff"/>
    <rect x="5" y="-3.5" width="8.5" height="7" rx="1" fill="#3692e7"/>
    <rect x="12.5" y="-4.5" width="10" height="9" rx="1" fill="#fff"/>
    <rect x="21.5" y="-5.5" width="4" height="11" rx="1.2" fill="#3692e7"/>
  </g>
</svg>
